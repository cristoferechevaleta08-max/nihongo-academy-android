name: Android build
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - run: gradle --no-daemon :app:assembleDebug
      - run: gradle --no-daemon :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: nihongo-academy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
